set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# On WSL, pbcopy is a shim from the zsh wsl module.
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g history-limit 10000

set -g allow-passthrough on
setw -g xterm-keys on

# Neovim settings. Without a short escape-time, Esc waits half a second
# before Neovim sees it.
set -g escape-time 10
set -g focus-events on

# macOS's system terminfo has no tmux-256color entry.
if-shell 'infocmp tmux-256color' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'

# iTerm2 and Windows Terminal both report xterm-256color and support true color.
set -as terminal-features ',xterm-256color:RGB'
